# RioMisc runtime configuration (config/runtime.yaml)
# Every value is Zod-validated at startup; invalid config aborts boot.

contest:
  adapter: none            # none = empty (Dashboard 接入比赛 / 单题 URL) | mock | local | ctfd
  poll:
    initialMs: 5000        # 5s default poll interval
    maxMs: 15000           # backoff ceiling
  # localChallengeDir: ./challenge   # required when adapter: local (rio solve)
  # 开机即接入 CTFd/DASCTF（也可运行时在 Dashboard 点「接入比赛」，不必改这里）：
  # adapter: ctfd
  # baseUrl: https://ctf.example.com
  # token: ""                # 或环境变量 CTFD_TOKEN
  # cookie: ""               # 或环境变量 CTFD_COOKIE
  # miscCryptoOnly: true     # 只拉 Misc / Crypto / 杂项 / 密码
  # trustedCredentialOrigins:  # 附件 CDN 需要带 Cookie 时填写
  #   - https://files.ctf.example.com

challenge:
  startPolicy: ON_SOLVER_ASSIGNMENT   # ON_DISCOVERY | ON_PREPARATION | ON_SOLVER_ASSIGNMENT

hint:
  autoFetch: true
  requireStalled: true     # only fetch when the solver looks stuck
  eligibleAfterStartMs: 600000        # 10 min after startChallenge()
  stallThresholdMs: 300000            # 5 min without progress

submission:
  autoSubmit: true
  confidenceThreshold: 0.85
  localMaxWrong: 3         # after 3 wrong: AUTO_SUBMIT_DISABLED → manual review
  defaultCooldownMs: 60000
  flagPattern: null        # null = prefix{payload} (flag / cumtctf / DASCTF / …)

workers:
  solverConcurrency: 4     # 8-core host → max 4 concurrent solvers
  triageConcurrency: 4

resources:
  llm: 6
  cpuLight: 4
  cpuHeavy: 1
  memHeavy: 1
  diskHeavy: 1
  network: 4
  sage: 1

storage:
  globalWorkspaceLimitGb: 80
  reserveDiskGb: 10
  maxConcurrentDownloads: 2
  perChallengeSoftLimitGb: 8

agent:
  progressIntervalMs: 120000
  reflectionAfterStalledMs: 300000
  stallDetectMs: 180000
  contextCompactThreshold: 0.8
  compactTriggerThreshold: 0.7
  allowMockFallback: true   # 正式比赛建议 false：没 Provider 时不要假装在解

watchdog:
  checkMs: 30000
  heartbeatMs: 15000
  leaseTtlMs: 45000

models:
  primary: null            # set via Dashboard / CLI once providers are added
  fallback: null
  autoFallback: false

visual:
  maxVisionCallsPerChallenge: 40
  maxImagesPerCall: 4

# Manager is OFF by default so MVP-2 scheduler behavior is unchanged.
# Set enabled: true (mode SHADOW or ACTIVE) to turn on contest dispatch.
manager:
  enabled: false
  mode: SHADOW                 # OFF | SHADOW | ACTIVE
  replanIntervalMs: 30000
  debounceMs: 5000
  planTtlMs: 90000
  maxCandidates: 40
  failureMode: DETERMINISTIC_FALLBACK
  allowAutoPark: false
  callTimeoutMs: 45000

reflection:
  enabledByDefault: true
  mode: HYBRID                 # OFF | HEURISTIC | LLM | HYBRID
  maxConcurrent: 2
  cooldownMs: 300000
  callTimeoutMs: 45000
  triggers:
    stalledMs: 120000
    noSignalStreak: 3
    wrongFlag: true
    repeatedExperiment: true

server:
  host: 127.0.0.1
  port: 3000

paths:
  dataDir: ./data
  configDir: ./config
